<figcaption>The NitroGen model, read from bottom to top, with one tower per token. The frame encoder turns each 16 × 16 pixel square of the frame into a frame token. Each action token then passes 4 pairs of DiT blocks. In a cross-attention block it reads the frame tokens, and in a self-attention block it reads the other action tokens. Orange lines show these reads for $a_1$; every token does the same, and the weights are illustrative. Each block also has a feed-forward layer and an AdaLN layer that adds the flow time $\tau$.</figcaption>
