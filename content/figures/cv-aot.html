<figure>
<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CombatVLA answer format: action, truncation token, explanation" font-size="14">
<defs><marker id="ah-cv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="30" y="34" width="80" height="48" rx="3" fill="#999" fill-opacity="0.18" stroke="currentColor" stroke-opacity="0.55"/>

<rect x="200" y="40" width="200" height="56" rx="5" fill="#e8833a" fill-opacity="0.15" stroke="#e8833a"/>
<text x="300.0" y="64.5" fill="currentColor" text-anchor="middle" font-size="12" font-weight="bold">Qwen2.5-VL 3B</text>

<figcaption>One CombatVLA step. The answer is an action, the token &lt;TRUNC&gt;, and a fixed explanation for that action type. Training uses the whole answer. At play time, generation stops at &lt;TRUNC&gt;, and an executor sends the action to the game as keyboard and mouse input.</figcaption>
